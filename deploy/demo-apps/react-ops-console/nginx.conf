server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 上游用变量 + resolver 动态解析：nginx 默认只在启动时解析一次字面量主机名，
  # 若启动瞬间 DNS 返回错误地址会一直 502，直到重建 Pod。
  resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;

  # /java/* -> Java 订单服务（去掉前缀）
  location /java/ {
    rewrite ^/java/(.*)$ /$1 break;
    set $java_upstream java-order-service.demo.svc.cluster.local:8080;
    proxy_pass http://$java_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
  }

  # /python/* -> Python 库存服务（去掉前缀）
  location /python/ {
    rewrite ^/python/(.*)$ /$1 break;
    set $python_upstream python-inventory-service.demo.svc.cluster.local:8000;
    proxy_pass http://$python_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
