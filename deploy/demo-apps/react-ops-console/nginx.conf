server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # /java/* -> Java 订单服务（去掉前缀）
  location /java/ {
    proxy_pass http://java-order-service:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
  }

  # /python/* -> Python 库存服务（去掉前缀）
  location /python/ {
    proxy_pass http://python-inventory-service:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
