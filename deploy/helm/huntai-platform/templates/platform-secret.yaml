apiVersion: v1
kind: Secret
metadata:
  name: huntai-secrets
  labels:
    {{- include "huntai.labels" . | nindent 4 }}
type: Opaque
stringData:
  # 仅演示：口令来自 values，禁止把真实凭据写进 values 文件。
  POSTGRES_PASSWORD: {{ .Values.secrets.databasePassword | quote }}
  HUNTAI_DATABASE_URL: "postgresql+asyncpg://huntai:{{ .Values.secrets.databasePassword }}@{{ include "huntai.postgresHost" . }}:5432/huntai"
  HUNTAI_REDIS_URL: "redis://{{ include "huntai.redisHost" . }}:6379/0"
  HUNTAI_AUTH_SECRET: {{ .Values.secrets.authSecret | quote }}
  HUNTAI_DEV_AUTH_PASSWORD: {{ .Values.secrets.devAuthPassword | quote }}
  HUNTAI_MASK_KEY: {{ .Values.secrets.maskKey | quote }}
  HUNTAI_MASK_ENCRYPTION_KEY_REF: "env:HUNTAI_MASK_KEY"
  HUNTAI_SECRET_BACKEND: "env"
