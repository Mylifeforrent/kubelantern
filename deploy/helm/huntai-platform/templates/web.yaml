apiVersion: v1
kind: ConfigMap
metadata:
  name: huntai-web-nginx
  labels:
    {{- include "huntai.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      # 同源 API：SPA 默认 baseURL 为 /api/v1，无需 CORS。
      location /api/ {
        proxy_pass http://{{ include "huntai.apiHost" . }}:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        # SSE 必须关闭缓冲并放宽读超时，否则事件会被 nginx 攒批。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
      }

      location = /healthz {
        proxy_pass http://{{ include "huntai.apiHost" . }}:8000/healthz;
      }

      location / {
        try_files $uri $uri/ /index.html;
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: huntai-web
  labels:
    {{- include "huntai.labels" . | nindent 4 }}
    app.kubernetes.io/name: huntai-web
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: huntai-web
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: {{ .Values.web.nodePort }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: huntai-web
  labels:
    {{- include "huntai.labels" . | nindent 4 }}
    app.kubernetes.io/name: huntai-web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: huntai-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: huntai-web
        app.kubernetes.io/part-of: huntai-sre
    spec:
      containers:
        - name: web
          image: "{{ .Values.webImage.repository }}:{{ .Values.webImage.tag }}"
          imagePullPolicy: {{ .Values.webImage.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
      volumes:
        - name: nginx-config
          configMap:
            name: huntai-web-nginx
