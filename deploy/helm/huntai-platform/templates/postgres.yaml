apiVersion: v1
kind: Service
metadata:
  name: huntai-postgres
  labels:
    {{- include "huntai.labels" . | nindent 4 }}
    app.kubernetes.io/name: huntai-postgres
spec:
  selector:
    app.kubernetes.io/name: huntai-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: huntai-postgres
  labels:
    {{- include "huntai.labels" . | nindent 4 }}
    app.kubernetes.io/name: huntai-postgres
spec:
  serviceName: huntai-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: huntai-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: huntai-postgres
        app.kubernetes.io/part-of: huntai-sre
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: huntai
            - name: POSTGRES_DB
              value: huntai
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: huntai-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U huntai -d huntai"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U huntai -d huntai"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.postgres.storageClassName }}
        storageClassName: {{ .Values.postgres.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage | quote }}
