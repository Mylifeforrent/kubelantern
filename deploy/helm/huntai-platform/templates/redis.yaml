apiVersion: v1
kind: Service
metadata:
  name: huntai-redis
  labels:
    {{- include "huntai.labels" . | nindent 4 }}
    app.kubernetes.io/name: huntai-redis
spec:
  selector:
    app.kubernetes.io/name: huntai-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: huntai-redis
  labels:
    {{- include "huntai.labels" . | nindent 4 }}
    app.kubernetes.io/name: huntai-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: huntai-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: huntai-redis
        app.kubernetes.io/part-of: huntai-sre
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          imagePullPolicy: IfNotPresent
          args: ["redis-server", "--appendonly", "no", "--save", ""]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
