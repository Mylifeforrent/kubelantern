{{- if .Values.seed.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: huntai-seed
  labels:
    {{- include "huntai.labels" . | nindent 4 }}
    app.kubernetes.io/name: huntai-seed
  annotations:
    # 迁移在 API 的 initContainer 完成；seed 等 API ready 后执行，避免与迁移竞态。
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: huntai-seed
        app.kubernetes.io/part-of: huntai-sre
    spec:
      restartPolicy: OnFailure
      # 同 API：禁止 Service 环境变量污染 HUNTAI_* 配置。
      enableServiceLinks: false
      initContainers:
        - name: wait-for-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              until python -c "import urllib.request; urllib.request.urlopen('http://{{ include "huntai.apiHost" . }}:8000/healthz', timeout=2)" 2>/dev/null; do
                echo "waiting for api"; sleep 2;
              done
      containers:
        - name: seed
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              python -m huntai.seed{{ if .Values.seed.withAlerts }} --with-alerts{{ end }}
          envFrom:
            - secretRef:
                name: huntai-secrets
          env:
            - name: HUNTAI_ENV
              value: {{ .Values.config.env | quote }}
            - name: HUNTAI_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
{{- end }}
