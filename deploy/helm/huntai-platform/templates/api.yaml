apiVersion: v1
kind: Service
metadata:
  name: huntai-api
  labels:
    {{- include "huntai.labels" . | nindent 4 }}
    app.kubernetes.io/name: huntai-api
spec:
  selector:
    app.kubernetes.io/name: huntai-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: huntai-api
  labels:
    {{- include "huntai.labels" . | nindent 4 }}
    app.kubernetes.io/name: huntai-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: huntai-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: huntai-api
        app.kubernetes.io/part-of: huntai-sre
    spec:
      # 防止 K8s 为 huntai-api Service 注入 HUNTAI_API_PORT=tcp://...，
      # 与后端 Settings 的 HUNTAI_API_PORT 整数配置冲突。
      enableServiceLinks: false
      initContainers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              until python -c "import socket; socket.create_connection(('{{ include "huntai.postgresHost" . }}', 5432), 2)" 2>/dev/null; do
                echo "waiting for postgres"; sleep 2;
              done
              alembic upgrade head
              {{- if .Values.readonlyRBAC.enabled }}
              until [ -s /var/run/huntai/token/token ]; do
                echo "waiting for readonly service account token"; sleep 2;
              done
              {{- end }}
          envFrom:
            - secretRef:
                name: huntai-secrets
          env:
            - name: HUNTAI_ENV
              value: {{ .Values.config.env | quote }}
          volumeMounts:
            {{- if .Values.readonlyRBAC.enabled }}
            - name: readonly-token
              mountPath: /var/run/huntai/token
              readOnly: true
            {{- end }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["huntai-api"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: huntai-secrets
          env:
            - name: HUNTAI_ENV
              value: {{ .Values.config.env | quote }}
            - name: HUNTAI_API_HOST
              value: {{ .Values.config.apiHost | quote }}
            - name: HUNTAI_API_PORT
              value: {{ .Values.config.apiPort | quote }}
            - name: HUNTAI_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: HUNTAI_LOG_FORMAT
              value: {{ .Values.config.logFormat | quote }}
            - name: HUNTAI_AI_LOCAL_ENDPOINT
              value: {{ .Values.config.aiLocalEndpoint | quote }}
            - name: HUNTAI_AI_LOCAL_MODEL
              value: {{ .Values.config.aiLocalModel | quote }}
            - name: HUNTAI_AI_EGRESS_ENABLED
              value: {{ .Values.config.aiEgressEnabled | quote }}
            - name: HUNTAI_SSE_HEARTBEAT_SECONDS
              value: {{ .Values.config.sseHeartbeatSeconds | quote }}
            {{- if .Values.readonlyRBAC.enabled }}
            - name: HUNTAI_DEMO_CLUSTER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: huntai-readonly-token
                  key: token
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        {{- if .Values.readonlyRBAC.enabled }}
        - name: readonly-token
          secret:
            secretName: huntai-readonly-token
            optional: true
        {{- end }}
