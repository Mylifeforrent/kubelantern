apiVersion: v1
kind: ConfigMap
metadata:
  name: react-ops-console-nginx
  labels:
    {{- include "demo.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      location /java/ {
        proxy_pass http://java-order-service:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
      }

      location /python/ {
        proxy_pass http://python-inventory-service:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
      }

      location / {
        try_files $uri $uri/ /index.html;
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: react-ops-console
  labels:
    {{- include "demo.labels" . | nindent 4 }}
    app.kubernetes.io/name: react-ops-console
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: react-ops-console
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: {{ .Values.console.nodePort }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-ops-console
  labels:
    {{- include "demo.labels" . | nindent 4 }}
    app.kubernetes.io/name: react-ops-console
spec:
  replicas: {{ .Values.console.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: react-ops-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: react-ops-console
        app.kubernetes.io/part-of: huntai-sre-demo
        huntai.io/language: react
    spec:
      containers:
        - name: console
          image: {{ .Values.console.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.console.resources | nindent 12 }}
      volumes:
        - name: nginx-config
          configMap:
            name: react-ops-console-nginx
