apiVersion: v1
kind: Service
metadata:
  name: java-order-service
  labels:
    {{- include "demo.labels" . | nindent 4 }}
    app.kubernetes.io/name: java-order-service
spec:
  selector:
    app.kubernetes.io/name: java-order-service
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-order-service
  labels:
    {{- include "demo.labels" . | nindent 4 }}
    app.kubernetes.io/name: java-order-service
spec:
  replicas: {{ .Values.java.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: java-order-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: java-order-service
        app.kubernetes.io/part-of: huntai-sre-demo
        huntai.io/language: java
    spec:
      containers:
        - name: order-service
          image: {{ .Values.java.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            {{- toYaml .Values.java.resources | nindent 12 }}
