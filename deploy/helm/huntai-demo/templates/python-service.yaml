apiVersion: v1
kind: Service
metadata:
  name: python-inventory-service
  labels:
    {{- include "demo.labels" . | nindent 4 }}
    app.kubernetes.io/name: python-inventory-service
spec:
  selector:
    app.kubernetes.io/name: python-inventory-service
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-inventory-service
  labels:
    {{- include "demo.labels" . | nindent 4 }}
    app.kubernetes.io/name: python-inventory-service
spec:
  replicas: {{ .Values.python.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: python-inventory-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: python-inventory-service
        app.kubernetes.io/part-of: huntai-sre-demo
        huntai.io/language: python
    spec:
      containers:
        - name: inventory-service
          image: {{ .Values.python.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.python.resources | nindent 12 }}
