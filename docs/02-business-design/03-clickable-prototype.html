<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HuntAI SRE · 可点击交互原型</title>
<!-- 依据: docs/02-business-design/01-domain-model.md 与 02-interaction-flows.md §4（关键页面与关键操作流）
     视觉基准: keephq.dev 官方暗色设计令牌（仅做密度/对比度微调）。全部数据为虚构演示数据。
     单文件原型：无构建依赖，浏览器直接打开；正式前端实现遵循项目冻结技术栈（React+TS+Vite+Tailwind+shadcn/ui）。 -->
</head>
<body>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== HuntAI SRE 可点击原型 — 设计令牌基于 keephq.dev 官方色板，仅做密度/对比度微调 ===== */
#hp{
  /* Keep 官方暗色令牌（cdn.prod.website-files.com/.../keep-hq.webflow.shared.css） */
  --bg:#0b0c0d;            /* black-10 主背景 */
  --surface:#101112;       /* alt-bg-black 卡片 */
  --surface-2:#191a1e;     /* black-20 悬浮/激活 */
  --surface-3:#222325;     /* black-30 边框/交替 */
  --raise:#3d3d3f;         /* black-40 */
  --tx-dim:#5a5a5b;        /* black-50 */
  --tx-2:#808083;          /* black-60 次要文字 */
  --tx-3:#a9a9ab;          /* black-70 */
  --tx:#d3d6d8;            /* white-70 正文（dark--text-primary） */
  --tx-hi:#fefeff;         /* white-10 标题 */
  --brand:#c53520;         /* brand-20 主按钮 */
  --brand-h:#e6522c;       /* brand-30 hover */
  --brand-t:#f0865e;       /* brand-40 文本级 */
  --brand-w:#f7a97f;       /* brand-50 */
  --red:#ff1f47; --red-t:#ff6681;
  --green:#09e488; --green-t:#5cfcb9;
  --teal:#00d1ff; --teal-t:#56e0ff;
  --purple:#b236ff; --purple-t:#c972ff;
  --gold:#f2cc60;
  /* skill 微调：密度 8/10 间距节奏 + 语义半径 */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --r-s:8px; --r-m:12px; --r-l:14px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;
  height:900px; position:relative; overflow:hidden;
  display:flex; background:var(--bg); color:var(--tx);
  font:400 14px/1.55 var(--font); text-align:left;
  border:1px solid var(--surface-3); border-radius:var(--r-l);
}
#hp *,#hp *::before,#hp *::after{box-sizing:border-box;margin:0;padding:0}
#hp .ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
#hp ::selection{background:rgba(197,53,32,.45)}
#hp ::-webkit-scrollbar{width:10px;height:10px}
#hp ::-webkit-scrollbar-thumb{background:#26272b;border-radius:6px;border:3px solid var(--bg)}
#hp :focus-visible{outline:2px solid var(--purple);outline-offset:2px;border-radius:4px}
#hp button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
#hp a{color:var(--teal-t);text-decoration:none}
#hp a:hover{text-decoration:underline}
@media (prefers-reduced-motion:reduce){
  #hp *,#hp *::before,#hp *::after{animation:none!important;transition:none!important}
}

/* ===== 布局骨架 ===== */
#hp .side{width:228px;flex:none;background:var(--bg);border-right:1px solid var(--surface-3);display:flex;flex-direction:column}
#hp .main{flex:1;min-width:0;display:flex;flex-direction:column}
#hp .topbar{height:52px;flex:none;display:flex;align-items:center;gap:var(--s3);padding:0 var(--s4);border-bottom:1px solid var(--surface-3);background:var(--bg)}
#hp .content{flex:1;overflow-y:auto;padding:var(--s5) var(--s5) var(--s6)}

/* ===== 侧栏 ===== */
#hp .logo{display:flex;align-items:center;gap:10px;padding:14px 16px 12px}
#hp .logo-mark{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;
  background:linear-gradient(135deg,#e6522c,#c53520 55%,#8f1e12);color:#fff;box-shadow:0 2px 10px rgba(197,53,32,.35)}
#hp .logo-mark .ic{width:17px;height:17px;stroke-width:2}
#hp .logo b{font-size:14.5px;color:var(--tx-hi);letter-spacing:.2px}
#hp .logo small{display:block;font-size:10.5px;color:var(--tx-2);line-height:1.2}
#hp .navgrp{padding:10px 16px 4px;font-size:10.5px;letter-spacing:.14em;color:var(--tx-dim);text-transform:uppercase}
#hp .nav{display:flex;align-items:center;gap:10px;width:calc(100% - 16px);margin:1px 8px;padding:7px 10px;border-radius:var(--r-s);color:var(--tx-3);font-size:13.5px;transition:background .15s,color .15s}
#hp .nav:hover{background:var(--surface-2);color:var(--tx)}
#hp .nav.on{background:var(--surface-2);color:var(--tx-hi);box-shadow:inset 2.5px 0 0 var(--brand)}
#hp .nav .ic{color:var(--tx-2)}
#hp .nav.on .ic{color:var(--brand-t)}
#hp .nav .tag{margin-left:auto}
#hp .bdg{margin-left:auto;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--brand);color:#fff;font-size:10.5px;font-weight:600;display:grid;place-items:center;font-variant-numeric:tabular-nums}
#hp .bdg.pu{background:var(--purple)}
#hp .side-foot{margin-top:auto;padding:12px 16px;border-top:1px solid var(--surface-3);font-size:11px;color:var(--tx-dim);display:flex;align-items:center;gap:8px}
#hp .side-foot .dot-ok{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px rgba(9,228,136,.7)}

/* ===== 顶栏 ===== */
#hp .env{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:6px;background:rgba(0,209,255,.08);border:1px solid rgba(0,209,255,.25);color:var(--teal-t);font-size:11.5px}
#hp .gsearch{display:flex;align-items:center;gap:8px;width:300px;height:32px;padding:0 10px;border-radius:var(--r-s);background:var(--surface);border:1px solid var(--surface-3);color:var(--tx-2)}
#hp .gsearch input{flex:1;background:none;border:none;outline:none;color:var(--tx-hi);font:inherit;font-size:13px}
#hp .gsearch input::placeholder{color:var(--tx-dim)}
#hp .iconbtn{position:relative;width:32px;height:32px;border-radius:var(--r-s);display:grid;place-items:center;color:var(--tx-2);transition:background .15s,color .15s}
#hp .iconbtn:hover{background:var(--surface-2);color:var(--tx)}
#hp .iconbtn .pip{position:absolute;top:4px;right:4px;min-width:14px;height:14px;padding:0 3px;border-radius:7px;background:var(--brand);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center}
#hp .rolebox{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:var(--r-s);background:var(--surface);border:1px solid var(--surface-3)}
#hp .rolebox select{background:none;border:none;outline:none;color:var(--tx-hi);font:inherit;font-size:12.5px;cursor:pointer}
#hp .rolebox select option{background:var(--surface-2);color:var(--tx)}
#hp .avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#49023a,#992a6c);color:#f6c6d5;display:grid;place-items:center;font-size:11px;font-weight:600;flex:none}

/* ===== 页面通用 ===== */
#hp .ph{display:flex;align-items:flex-start;gap:var(--s4);margin-bottom:var(--s4)}
#hp .ph h1{font-size:17px;font-weight:600;color:var(--tx-hi);letter-spacing:.1px}
#hp .ph p{font-size:12.5px;color:var(--tx-2);margin-top:2px}
#hp .ph .sp{flex:1}
#hp .card{background:var(--surface);border:1px solid var(--surface-3);border-radius:var(--r-m)}
#hp .card-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--surface-3);font-size:13px;font-weight:600;color:var(--tx-hi)}
#hp .card-h .ic{color:var(--tx-2)}
#hp .muted{color:var(--tx-2)} .tiny{font-size:11.5px} .mono{font-family:var(--mono);font-size:12px}
#hp .num{font-variant-numeric:tabular-nums}
#hp .grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)}
#hp .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s3);margin-bottom:var(--s4)}
#hp .stat{background:var(--surface);border:1px solid var(--surface-3);border-radius:var(--r-m);padding:12px 14px}
#hp .stat .l{font-size:11.5px;color:var(--tx-2);display:flex;align-items:center;gap:6px}
#hp .stat .v{font-size:22px;font-weight:600;color:var(--tx-hi);margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
#hp .stat .s{font-size:11.5px;color:var(--tx-dim);margin-top:2px}
#hp .stat .s b{font-weight:500}
#hp .up{color:var(--green-t)} #hp .down{color:var(--red-t)} #hp .warm{color:var(--brand-w)}

/* ===== 徽章 / 状态 ===== */
#hp .chip{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:5px;font-size:11px;font-weight:500;white-space:nowrap;border:1px solid transparent}
#hp .chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
#hp .sev-p1{color:var(--red-t);background:rgba(255,31,71,.10);border-color:rgba(255,31,71,.35)}
#hp .sev-p2{color:var(--brand-t);background:rgba(197,53,32,.13);border-color:rgba(197,53,32,.40)}
#hp .sev-p3{color:var(--gold);background:rgba(242,204,96,.08);border-color:rgba(242,204,96,.30)}
#hp .sev-p4{color:var(--teal-t);background:rgba(0,209,255,.07);border-color:rgba(0,209,255,.28)}
#hp .st-notified{color:var(--teal-t);background:rgba(0,209,255,.07);border-color:rgba(0,209,255,.28)}
#hp .st-corr{color:var(--purple-t);background:rgba(178,54,255,.10);border-color:rgba(178,54,255,.35)}
#hp .st-cand{color:var(--purple-t);background:rgba(178,54,255,.10);border-color:rgba(178,54,255,.45);border-style:dashed}
#hp .st-supp{color:var(--tx-2);background:rgba(128,128,131,.10);border-color:rgba(128,128,131,.30)}
#hp .st-ack{color:var(--teal-t);background:rgba(0,209,255,.07);border-color:rgba(0,209,255,.28)}
#hp .st-closed{color:var(--tx-2);background:rgba(128,128,131,.10);border-color:rgba(128,128,131,.30)}
#hp .st-open{color:var(--red-t);background:rgba(255,31,71,.10);border-color:rgba(255,31,71,.35)}
#hp .st-mit{color:var(--gold);background:rgba(242,204,96,.08);border-color:rgba(242,204,96,.30)}
#hp .st-res{color:var(--green-t);background:rgba(9,228,136,.08);border-color:rgba(9,228,136,.32)}
#hp .ai-chip{color:var(--purple-t);background:rgba(178,54,255,.10);border-color:rgba(178,54,255,.35)}
#hp .ok-chip{color:var(--green-t);background:rgba(9,228,136,.08);border-color:rgba(9,228,136,.32)}
#hp .tag{display:inline-flex;align-items:center;height:17px;padding:0 6px;border-radius:4px;font-size:10px;letter-spacing:.05em;background:var(--surface-3);color:var(--tx-3)}
#hp .tag.pu{background:rgba(178,54,255,.15);color:var(--purple-t)}
#hp .tag.br{background:rgba(197,53,32,.15);color:var(--brand-w)}
#hp .tag.gd{background:rgba(242,204,96,.12);color:var(--gold)}

/* ===== 按钮 ===== */
#hp .btn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px;border-radius:var(--r-s);border:1px solid var(--raise);background:var(--surface-2);color:var(--tx);font-size:12.5px;font-weight:500;transition:background .15s,border-color .15s,color .15s;white-space:nowrap}
#hp .btn:hover{background:var(--surface-3);border-color:var(--raise)}
#hp .btn:disabled{opacity:.45;cursor:not-allowed}
#hp .btn-p{background:var(--brand);border-color:transparent;color:#fff}
#hp .btn-p:hover{background:var(--brand-h)}
#hp .btn-ai{background:rgba(178,54,255,.10);border-color:rgba(178,54,255,.45);color:var(--purple-t)}
#hp .btn-ai:hover{background:rgba(178,54,255,.2);border-color:var(--purple)}
#hp .btn-d{background:rgba(255,31,71,.08);border-color:rgba(255,31,71,.4);color:var(--red-t)}
#hp .btn-d:hover{background:rgba(255,31,71,.16)}
#hp .btn-sm{height:26px;padding:0 10px;font-size:11.5px;gap:5px}
#hp .ibtn{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:var(--tx-2);border:1px solid transparent;transition:background .15s,color .15s}
#hp .ibtn:hover{background:var(--surface-3);color:var(--tx-hi)}
#hp .ibtn .ic{width:14px;height:14px}

/* ===== 管道可视化 ===== */
#hp .pipe{display:grid;grid-template-columns:1fr 1fr 1fr 1.2fr;gap:var(--s3);margin-bottom:var(--s4)}
#hp .pstep{background:var(--surface);border:1px solid var(--surface-3);border-radius:var(--r-m);padding:11px 14px;position:relative;transition:border-color .3s,box-shadow .3s}
#hp .pstep .n{font-size:11px;color:var(--tx-2);display:flex;align-items:center;gap:6px}
#hp .pstep .v{font-size:17px;font-weight:600;color:var(--tx-hi);margin-top:2px;font-variant-numeric:tabular-nums}
#hp .pstep .d{font-size:11px;color:var(--tx-dim);margin-top:1px}
#hp .pstep.act{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand),0 0 18px rgba(230,82,44,.18)}
#hp .pstep .arr{position:absolute;right:-15px;top:50%;transform:translateY(-50%);color:var(--tx-dim);z-index:1}

/* ===== 过滤器 / 表格 ===== */
#hp .fbar{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s3);flex-wrap:wrap}
#hp .seg{display:flex;gap:2px;background:var(--surface);border:1px solid var(--surface-3);border-radius:var(--r-s);padding:2px}
#hp .seg button{height:24px;padding:0 10px;border-radius:6px;font-size:12px;color:var(--tx-2)}
#hp .seg button:hover{color:var(--tx)}
#hp .seg button.on{background:var(--surface-3);color:var(--tx-hi);font-weight:500}
#hp select.inp,#hp input.inp{height:30px;padding:0 10px;border-radius:var(--r-s);background:var(--surface);border:1px solid var(--surface-3);color:var(--tx-hi);font:inherit;font-size:12.5px;outline:none}
#hp select.inp option{background:var(--surface-2)}
#hp input.inp::placeholder{color:var(--tx-dim)}
#hp input.inp:focus,#hp select.inp:focus{border-color:var(--brand)}
#hp .tblwrap{overflow-x:auto}
#hp table{width:100%;border-collapse:collapse;font-size:13px}
#hp th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx-dim);font-weight:500;text-align:left;padding:9px 14px;border-bottom:1px solid var(--surface-3);white-space:nowrap}
#hp td{padding:10px 14px;border-bottom:1px solid rgba(34,35,37,.6);vertical-align:middle}
#hp tr:last-child td{border-bottom:none}
#hp tbody tr.click{cursor:pointer;transition:background .12s}
#hp tbody tr.click:hover{background:rgba(25,26,30,.7)}
#hp .atitle{color:var(--tx-hi);font-weight:500;font-size:13px}
#hp .asub{font-size:11px;color:var(--tx-2);margin-top:1px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#hp .rowacts{display:flex;gap:2px;justify-content:flex-end}
#hp .empty{padding:36px;text-align:center;color:var(--tx-dim);font-size:13px}

/* ===== 候选事件卡片 ===== */
#hp .cand{margin-bottom:var(--s4)}
#hp .cand .mem{display:flex;align-items:center;gap:10px;padding:8px 16px;border-top:1px solid rgba(34,35,37,.6);font-size:12.5px}
#hp .cand .mem .mono{color:var(--tx-3)}
#hp .rulebox{margin:10px 16px 12px;padding:10px 12px;border-radius:var(--r-s);background:rgba(178,54,255,.06);border:1px solid rgba(178,54,255,.22);font-size:12px;color:var(--tx-3)}
#hp .rulebox b{color:var(--purple-t);font-weight:600}
#hp .simbar{height:4px;border-radius:2px;background:rgba(178,54,255,.18);overflow:hidden;margin-top:5px}
#hp .simbar i{display:block;height:100%;background:var(--purple)}

/* ===== 抽屉 / 弹层 ===== */
#hp .scrim{position:absolute;inset:0;background:rgba(3,4,5,.62);backdrop-filter:blur(2px);z-index:40;animation:fade .18s}
#hp .drawer{position:absolute;top:0;right:0;bottom:0;width:500px;max-width:92%;background:var(--surface);border-left:1px solid var(--surface-3);z-index:41;display:flex;flex-direction:column;animation:slidein .2s ease-out}
#hp .drawer-h{display:flex;align-items:flex-start;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--surface-3)}
#hp .drawer-b{flex:1;overflow-y:auto;padding:14px 18px}
#hp .drawer-f{padding:12px 18px;border-top:1px solid var(--surface-3);display:flex;gap:8px;flex-wrap:wrap}
#hp .modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(600px,94%);max-height:88%;overflow-y:auto;background:var(--surface);border:1px solid var(--raise);border-radius:var(--r-l);z-index:41;box-shadow:0 24px 70px rgba(0,0,0,.6);animation:pop .18s ease-out}
#hp .modal-h{display:flex;align-items:center;gap:10px;padding:16px 20px 12px}
#hp .modal-h h3{font-size:15px;color:var(--tx-hi);font-weight:600}
#hp .modal-b{padding:4px 20px 18px;font-size:13px}
#hp .modal-f{padding:12px 20px 16px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--surface-3)}
#hp .kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:12.5px}
#hp .kv dt{color:var(--tx-2)} #hp .kv dd{color:var(--tx-hi)}
#hp pre.code{background:#0c0d0f;border:1px solid var(--surface-3);border-radius:var(--r-s);padding:12px;font-family:var(--mono);font-size:11.5px;line-height:1.6;color:var(--tx-3);overflow-x:auto;white-space:pre}
#hp pre.code .add{display:inline-block;width:100%;color:var(--green-t);background:rgba(9,228,136,.09)}
#hp pre.code .del{display:inline-block;width:100%;color:var(--red-t);background:rgba(255,31,71,.08)}
#hp .tabs{display:flex;gap:2px;padding:0 18px;border-bottom:1px solid var(--surface-3)}
#hp .tabs button{height:34px;padding:0 11px;font-size:12.5px;color:var(--tx-2);border-bottom:2px solid transparent;margin-bottom:-1px}
#hp .tabs button:hover{color:var(--tx)}
#hp .tabs button.on{color:var(--tx-hi);border-bottom-color:var(--brand)}
#hp .aibox{border:1px solid rgba(178,54,255,.35);background:rgba(178,54,255,.06);border-radius:var(--r-m);padding:13px 14px;font-size:12.5px}
#hp .aibox .ah{display:flex;align-items:center;gap:8px;color:var(--purple-t);font-weight:600;font-size:12.5px;margin-bottom:8px}
#hp .aibox ul{margin:8px 0 0 16px;display:grid;gap:5px;color:var(--tx)}
#hp .aibox .foot{margin-top:10px;padding-top:9px;border-top:1px dashed rgba(178,54,255,.3);font-size:11px;color:var(--tx-2);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#hp .radios{display:grid;gap:8px;margin:10px 0}
#hp .radios label{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border:1px solid var(--surface-3);border-radius:var(--r-s);cursor:pointer;font-size:12.5px;transition:border-color .15s}
#hp .radios label:hover{border-color:var(--raise)}
#hp .radios input{accent-color:var(--brand);margin-top:2px}

/* ===== 时间线 / 步进器 ===== */
#hp .tl{position:relative;padding-left:20px;display:grid;gap:0}
#hp .tl::before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--surface-3)}
#hp .tli{position:relative;padding:7px 0}
#hp .tli::before{content:'';position:absolute;left:-19px;top:14px;width:9px;height:9px;border-radius:50%;background:var(--tx-dim);border:2px solid var(--bg)}
#hp .tli.auto::before{background:var(--teal)}
#hp .tli.ai::before{background:var(--purple);box-shadow:0 0 8px rgba(178,54,255,.6)}
#hp .tli.esc::before{background:var(--brand)}
#hp .tli.man::before{background:var(--green)}
#hp .tli .tt{font-size:11px;color:var(--tx-dim);display:flex;gap:8px;align-items:center}
#hp .tli .tx{font-size:12.5px;color:var(--tx);margin-top:1px}
#hp .steps{display:flex;gap:6px;margin:14px 0 4px}
#hp .stp{flex:1;min-width:0}
#hp .stp .bar{height:3px;border-radius:2px;background:var(--surface-3)}
#hp .stp.done .bar{background:var(--green)}
#hp .stp.cur .bar{background:var(--brand)}
#hp .stp .lb{font-size:10.5px;color:var(--tx-dim);margin-top:5px;text-align:center;white-space:nowrap}
#hp .stp.done .lb{color:var(--green-t)} #hp .stp.cur .lb{color:var(--brand-w)}

/* ===== 排班 / 其他 ===== */
#hp .week{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--s2)}
#hp .day{background:var(--surface);border:1px solid var(--surface-3);border-radius:var(--r-s);padding:10px;min-height:86px}
#hp .day.today{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
#hp .day .dn{font-size:11px;color:var(--tx-2)}
#hp .day .who{font-size:12.5px;color:var(--tx-hi);margin-top:6px;font-weight:500}
#hp .day .who small{display:block;font-size:10.5px;color:var(--tx-2);font-weight:400}
#hp .switch{position:relative;width:34px;height:19px;flex:none}
#hp .switch input{position:absolute;opacity:0;width:100%;height:100%;cursor:pointer;z-index:1}
#hp .switch i{position:absolute;inset:0;border-radius:10px;background:var(--surface-3);transition:background .15s}
#hp .switch i::after{content:'';position:absolute;left:2.5px;top:2.5px;width:14px;height:14px;border-radius:50%;background:var(--tx-2);transition:transform .15s,background .15s}
#hp .switch input:checked+i{background:rgba(9,228,136,.35)}
#hp .switch input:checked+i::after{transform:translateX(15px);background:var(--green)}
#hp .bars{display:flex;align-items:flex-end;gap:6px;height:110px;padding:4px 2px 0}
#hp .bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;height:100%}
#hp .bars .b i{border-radius:3px 3px 0 0;min-height:2px}
#hp .bars .b span{font-size:10px;color:var(--tx-dim);text-align:center;margin-top:5px}
#hp .linklist{display:grid;gap:6px;font-size:12.5px}
#hp .linklist .li{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--surface-3);border-radius:var(--r-s);cursor:pointer;transition:border-color .15s,background .15s}
#hp .linklist .li:hover{border-color:var(--raise);background:var(--surface-2)}

/* ===== Toast ===== */
#hp .toasts{position:absolute;right:16px;bottom:16px;z-index:60;display:grid;gap:8px;max-width:380px}
#hp .toast{background:#17181b;border:1px solid #2a2b2f;border-left:3px solid var(--teal);border-radius:10px;padding:10px 13px;font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:tin .22s ease-out}
#hp .toast.ok{border-left-color:var(--green)} #hp .toast.err{border-left-color:var(--red)}
#hp .toast.ai{border-left-color:var(--purple)} #hp .toast.warn{border-left-color:var(--gold)}
#hp .toast b{color:var(--tx-hi);display:block;font-size:12.5px;margin-bottom:1px}
#hp .toast .ta{color:var(--teal-t);font-size:12px;margin-top:5px;display:inline-flex;align-items:center;gap:4px;cursor:pointer}
#hp .toast .ta:hover{text-decoration:underline}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes slidein{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-48%)}to{opacity:1;transform:translate(-50%,-50%)}}

/* ===== 响应式（skill 清单：375/768/1024/1440 不重叠） ===== */
@media (max-width:1024px){
  #hp .stats{grid-template-columns:repeat(2,1fr)}
  #hp .pipe{grid-template-columns:repeat(2,1fr)}
  #hp .pipe .pstep .arr{display:none}
  #hp .grid2{grid-template-columns:1fr}
  #hp .week{grid-template-columns:repeat(4,1fr)}
}
@media (max-width:820px){
  #hp .side{width:56px}
  #hp .side .lbl,#hp .side .navgrp,#hp .side .logo small,#hp .side .logo b,#hp .side-foot{display:none}
  #hp .side .logo{justify-content:center;padding:12px 0}
  #hp .nav{justify-content:center;padding:9px 0;width:calc(100% - 12px);margin:1px 6px}
  #hp .nav .bdg{position:absolute;transform:translate(10px,-8px)}
  #hp .nav{position:relative}
  #hp .gsearch{width:150px}
  #hp .week{grid-template-columns:repeat(2,1fr)}
}

function renderLayer(){
 const L=$('hp-layer');
 let h='';
 if(S.modal){
  const m=modals[S.modal]&&modals[S.modal]();
  if(m)h=`<div class="scrim" data-act="close-layer"></div><div class="modal" role="dialog" aria-modal="true">${m}</div>`;
 }else if(S.drawer){
  h=`<div class="scrim" data-act="close-layer"></div><div class="drawer" role="dialog" aria-modal="true" aria-label="告警详情">${renderDrawer()}</div>`;
 }
 L.innerHTML=h;
}

 diff(){return `<div class="modal-h">${ic('file','color:var(--purple-t)')}<h3 style="flex:1">Workflow YAML diff · checkout-oom-annotate</h3><span class="tag pu">AI 提议 BR-05</span><button class="ibtn" data-act="close-layer" aria-label="关闭">${ic('x')}</button></div>
  <div class="modal-b"><p class="muted tiny">AI 生成内容仅具有「提议」地位，确认入库前不得执行（BR-05）。入库后标记 ai_generated + approved_by，并同步 Git 可回滚。</p>
  <pre class="code" style="margin-top:12px"><span class="del">- version: v2  # manual</span><span class="add">+ version: v3  # ai_generated</span>
 triggers:
   - type: alert
     filters:
       - alertname: KubePodCrashLooping
<span class="add">+       - namespace: checkout   # AI 新增：限定命名空间</span>
 steps:
   - name: annotate
     tool: kubectl.annotate
     args:
       namespace: checkout
<span class="add">+   - name: notify-oncall        # AI 新增：通知值班组</span>
<span class="add">+     tool: dingtalk.send</span>
<span class="add">+     args: {group: 电商SRE-Primary, template: oom-quick}</span></pre></div>
  <div class="modal-f"><button class="btn" data-act="close-layer">需要修改（回 AI）</button><button class="btn btn-p" data-act="diff-ok">${ic('check')}确认入库 v3</button></div>`;},
 nlgen(){return `<div class="modal-h">${ic('spark','color:var(--purple-t)')}<h3 style="flex:1">自然语言生成 Workflow（A3 · P3）</h3><span class="tag pu">BR-05</span><button class="ibtn" data-act="close-layer" aria-label="关闭">${ic('x')}</button></div>

  <div style="margin-top:10px" class="tiny muted">AI 网关：脱敏（BR-01）→ 预算检查（BR-03）→ 生成 YAML 草稿 → diff 预览</div></div>
  <div class="modal-f"><button class="btn" data-act="close-layer">取消</button><button class="btn btn-ai" data-act="nl-ok">${ic('spark')}生成草稿并预览 diff</button></div>`;},
 logs(){const t=D.aiTasks.find(x=>x.id===S.modalArg);if(!t)return'';
  const logs=t.id==='TASK-1042'
   ?[['14:05','ctx.build','关联告警×2 + Finding×1 + 最近变更',0.3,'0.4s','ok'],['14:05','kubectl.get pod -n checkout','[masked] pod=*****-x2',1.2,'0.6s','ok'],['14:06','promql: container_oom_walk_total','range 30m · 18 series',2.1,'0.9s','ok'],['14:07','kubectl.delete pod（写类）','— 挂起待审批 —','—','—','pending_approval']]
   :t.id==='TASK-1041'?[['13:58','sanitize','掩码 5 个敏感字段，映射表存本地（BR-01）',0.1,'0.2s','ok'],['13:58','llm.chat qwen2.5-32b','finding F-202 raw_error 片段',1.1,'0.7s','ok']]
   :t.id==='TASK-1039'?[['11:02','llm.chat gpt-oss-120b','循环第 38 轮 · 工具输出截断治理','8.2k','2.1s','ok'],['11:04','budget.check','calls 40/40 · tokens 100k/100k → graceful 终止','0','0.0s','budget_exceeded']]
   :[['14:20','sanitize','掩码 3 个字段',0.1,'0.2s','ok'],['14:21','llm.chat gpt-oss-120b','NL→YAML 草稿生成','4.2k','1.8s','ok'],['14:21','diff.build','与 WF-014 v2 对比','0','0.1s','ok']];
  return `<div class="modal-h">${ic('term','color:var(--purple-t)')}<h3 style="flex:1">调用链 · ${t.id}</h3><span class="tag">AICallLog · 不可删改 BR-10</span><button class="ibtn" data-act="close-layer" aria-label="关闭">${ic('x')}</button></div>
  <div class="modal-b"><div class="tblwrap"><table aria-label="调用日志">

   <tbody>${logs.map(l=>`<tr><td class="tiny num">${l[0]}</td><td class="mono tiny" style="color:var(--tx-hi)">${esc(l[1])}</td><td class="tiny">${esc(l[2])}</td><td class="tiny num">${l[3]}</td><td class="tiny num">${l[4]}</td><td class="tiny ${l[5]==='ok'?'up':'warm'}">${l[5]}</td></tr>`).join('')}
  </tbody></table></div>
  <p class="tiny muted" style="margin-top:12px">who / when / what / cost 全量留痕；审计日志不可删改（BR-10）。</p></div>

/* ============ 主渲染 ============ */
const PAGES={alerts:pageAlerts,candidates:pageCandidates,incidents:pageIncidents,inspections:pageInspections,ai:pageAI,workflows:pageWF,oncall:pageOncall,admin:pageAdmin};
function render(){
 renderNav();
 $('hp-view').innerHTML=(PAGES[S.page]||pageAlerts)();
 renderLayer();
}

/* ============ 动作 ============ */
function findAlert(id){return D.alerts.find(a=>a.id===id)}
function advanceInc(id,step){
 const i=D.incidents.find(x=>x.id===id);if(!i)return;
 const t=new Date();const hh=String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
 const map={ack:['acknowledged','确认处理（Ack），升级链停止'],mit:['mitigated','止血完成'],res:['resolved','根因恢复，服务恢复正常'],close:['closed','事件关闭']};
 i.status=map[step][0];
 i.timeline.push({t:hh,k:'man',x:ROLE_NAME[S.role]+' '+map[step][1]});
 if(step==='res'){toast('状态页已恢复更新','事件 resolved，状态页自动同步恢复信息（BR-06）','ok');i.sp='synced';}
 if(step==='close'&&(i.sev==='P1'||i.sev==='P2')){toast('复盘模板已生成','P1/P2 事件关闭前生成 Postmortem 模板，时间线自动汇总，Action Items 待分派（L3 链路）','ai');i.timeline.push({t:hh,k:'auto',x:'复盘模板已生成，复盘结论将回流：关联/富化/巡检规则与 runbook'});}
 else toast('事件状态已更新',map[step][1]+' · 已写入时间线与审计日志（BR-10）','ok');
 render();
}
function createIncident(title,sev,alerts,from){
 const id='INC-'+(S.incSeq++);
 D.incidents.unshift({id,sev,title,status:'open',assignee:null,team:'电商-交易',sp:'synced',at:'刚刚',alerts,timeline:[{t:'刚刚',k:'auto',x:from}]});
 return id;
}

root.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el)return;
 const act=el.dataset.act,id=el.dataset.id;
 switch(act){
  case 'nav':S.page=id;S.incView=null;render();break;
  case 'alert-open':openDrawer(findAlert(id));break;
  case 'tab':S.drawerTab=id;renderLayer();break;
  case 'close-layer':S.drawer=null;S.modal=null;renderLayer();break;
  case 'sevf':S.sev=id;render();break;
  case 'ack':{const a=findAlert(id);a.status='acked';if(S.drawer===id)S.drawerTab='detail';toast('告警已认领','Ack 后升级链停止（BR-08）· 处置留痕（BR-10）','ok');render();break;}
  case 'closealert':{const a=findAlert(id);a.status='closed';toast('告警已关闭','人工关闭已记录（who/when/what）','ok');render();break;}
  case 'toinc':{const a=findAlert(id);const inc=createIncident(a.title.replace(/\s·\s.*/,'')+' 告警立项',a.sev,[a.id],'告警 '+a.id+' 人工转事件立项（告警处置流）');a.status='correlated';a.inc=inc;S.drawer=null;S.page='incidents';S.incView=inc;render();toast('事件已立项',inc+' · 状态页已自动同步（BR-06）','ok');break;}
  case 'suppress':S.modal='suppress';S.modalArg=id;renderLayer();break;
  case 'suppress-ok':{const a=findAlert(id);a.status='suppressed';S.modal=null;renderLayer();render();toast('已进入降噪反馈池','抑制原因将用于降噪规则调优（告警处置流）','warn');break;}
  case 'simulate':{if(S.pipeline)return;S.pipeline={running:true,step:0};render();
   const iv=setInterval(()=>{S.pipeline.step++;if(S.pipeline.step>=4){clearInterval(iv);
    D.alerts.unshift({id:'AL-2049',sev:'P2',title:'KubePodNotScheduled · inventory-svc',provider:'Alertmanager',fp:'alertname=KubePodNotScheduled,namespace=inventory,pod=inv-6c8d9-pq5',count:3,team:'电商-交易',env:'prod',status:'notified',at:'刚刚',note:'fingerprint[alertname,namespace] 部分相同合并 ×3',ai:null});
    S.pipeline={running:false,step:0};render();
    toast('新告警已接入','KubePodNotScheduled · 去重合并 ×3 → 富化 → 未命中关联，独立通知（L1 链路）','ok');}
    else render();},650);break;}
  case 'cand-ok':{const c=D.candidates.find(x=>x.id===id);D.candidates=D.candidates.filter(x=>x.id!==id);
   const inc=createIncident(c.title,c.members[0].sev,['AL-2041','AL-2045'],'候选事件 '+c.id+' 经人工确认立项（BR-04）· 命中规则 '+c.rule);
   S.page='incidents';S.incView=inc;render();toast('候选已确认立项',inc+' 已创建 · 状态页自动同步（BR-06）','ok');break;}
  case 'cand-no':S.modal='reject';S.modalArg=id;renderLayer();break;
  case 'reject-ok':{D.candidates=D.candidates.filter(x=>x.id!==id);S.modal=null;renderLayer();render();toast('候选已驳回','驳回原因已回流至规则调优队列（候选事件确认流）','warn');break;}
  case 'inc-open':S.incView=id;render();break;
  case 'inc-back':S.incView=null;render();break;
  case 'inc-adv':advanceInc(id,el.dataset.step);break;
  case 'sp-wd':{const i=D.incidents.find(x=>x.id===id);i.sp='none';render();toast('状态页同步已撤回','人工撤回动作已记录（BR-06 支持撤回）','warn');break;}
  case 'agent-go':{const t={id:'TASK-1043',type:'investigate',obj:id+' · Agent 自动调查',model:'gpt-oss-120b（本地 vLLM）',status:'running',calls:1,callsMax:40,tokens:'2k / 100k',by:ROLE_NAME[S.role],note:'上下文已构造：关联告警 + Finding + 拓扑标签 + 最近变更（脱敏 BR-01）'};
   D.aiTasks.unshift(t);S.page='ai';render();
   toast('Agent 调查已启动',t.id+' · 只读工具循环中，高危工具将挂起待审批','ai');
   setTimeout(()=>{if(D.aiTasks[0]===t){t.status='pending_approval';t.note='Agent 请求调用写类工具 → 挂起 pending_approval（BR-02）';t.tool='kubectl delete pod checkout-7d9f4-x2 -n checkout';t.reason='Pod 持续 OOMKilled，Agent 判定需删除重建，该工具为写类高危工具。';t.calls=9;t.tokens='21k / 100k';render();toast('AI 任务待审批',t.id+' 请求高危工具，请前往 AI 任务中心审批（BR-02）','ai',{label:'前往 AI 任务中心',act:'go-ai',id:''});}},2200);break;}
  case 'go-ai':S.page='ai';S.drawer=null;S.modal=null;render();break;
  case 'cluster':S.cluster=id;S.fAi=null;render();break;
  case 'f-claim':{const f=D.findings.find(x=>x.id===id);f.st='acknowledged';render();toast('Finding 已认领','状态机 open→acknowledged · 处置中可推进 in_progress','ok');break;}
  case 'f-ignore':{const f=D.findings.find(x=>x.id===id);f.st='ignored';render();toast('Finding 已忽略','原因已记录（状态机 open→ignored）','warn');break;}
  case 'f-ai':{const f=D.findings.find(x=>x.id===id);if(S.fAi===id){S.fAi=null;render();break;}
   S.fAi=id;
   if(!f.ai){render();setTimeout(()=>{if(S.fAi===id){f.ai={model:'qwen2.5-14b（本地 vLLM）',tokens:'0.9k 输出 tokens · 0.6s',text:'基于结构化 raw_error（确定性强、幻觉面最小）：建议优先核对资源配额与探针配置；如为瞬态故障，观察两个巡检周期是否复现后再处置。',digest:'输入仅错误片段，敏感字段已掩码（BR-01）'};render();}},1400);}else render();break;}
  case 'ai-approve':S.modal='approve';S.modalArg=id;renderLayer();break;
  case 'ai-ok':{const t=D.aiTasks.find(x=>x.id===id);t.status='running';t.calls++;S.modal=null;renderLayer();render();
   toast('已批准执行',t.id+' 继续运行 · 审批动作已写入审计（BR-10）','ok');
   setTimeout(()=>{t.status='completed';t.note='高危步骤执行完成，RCA 报告已回写 '+t.obj.split(' ')[0]+' 时间线（证据引用：工具调用+原始输出）';
    const inc=D.incidents.find(x=>x.id===t.obj.split(' ')[0]);
    if(inc)inc.timeline.push({t:'14:15',k:'ai',x:'AI 调查报告（'+t.id+'）：RCA 判定 OOMKilled 由 v2.31.0 内存泄漏引入；证据：kubectl describe ×2、promql ×3（每个结论带证据引用）'});
    render();toast('Agent 调查完成','RCA 已回写事件时间线并通知值班人 · AICallLog 全量留痕','ai');},2400);break;}
  case 'ai-reject':{const t=D.aiTasks.find(x=>x.id===id);t.status='cancelled';S.modal=null;renderLayer();render();toast('AI 任务已拒绝','任务终止，上下文留存可重发（BR-02 审批流）','warn');break;}
  case 'ai-logs':S.modal='logs';S.modalArg=id;renderLayer();break;
  case 'diff':S.modal='diff';renderLayer();break;
  case 'diff-ok':{const w=D.workflows.find(x=>x.name==='checkout-oom-annotate');if(w){w.ver='v3';w.src='ai_generated';w.by=ROLE_NAME[S.role];}S.modal=null;renderLayer();render();toast('Workflow 已入库','v3 · 标记 ai_generated · approved_by 当前用户（BR-05）· 已同步 Git','ai');break;}
  case 'nl-gen':S.modal='nlgen';renderLayer();break;
  case 'nl-ok':S.modal='diff';renderLayer();break;
  case 'route-sw':toast('模型路由配置','本地优先开关已记录变更（BR-12 · admin 操作留痕）','ai');break;
 }
});
root.addEventListener('submit',e=>{
 const f=e.target.closest('[data-act]');if(!f)return;e.preventDefault();
 if(f.dataset.act==='inc-note'){const i=D.incidents.find(x=>x.id===f.dataset.id);const v=f.querySelector('input').value.trim();if(!v)return;
  const t=new Date();const hh=String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
  i.timeline.push({t:hh,k:'man',x:ROLE_NAME[S.role]+'：'+v});render();}
});
root.addEventListener('change',e=>{
 if(e.target.id==='hp-stf'){S.st=e.target.value;render();}
});
root.addEventListener('input',e=>{
 if(e.target.id==='hp-q'){S.q=e.target.value.toLowerCase().trim();if(S.page!=='alerts'){S.page='alerts';}render();
  const q=$('hp-q');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length);}}

$('hp-role').addEventListener('change',e=>{
 S.role=e.target.value;S.page=can('admin:view')||S.page!=='admin'?S.page:'alerts';
 if(S.page==='candidates'&&!can('candidate:view'))S.page='alerts';

 S.drawer=null;S.modal=null;render();
 toast('角色已切换','当前身份：'+ROLE_NAME[S.role]+' · 按权限矩阵（领域模型 §3）过滤界面与操作','warn');
});
$('hp-bell').addEventListener('click',()=>{
 toast('通知中心','3 条未读：INC-1007 升级 L2 · TASK-1042 待审批 · gpu-node-03 候选事件待确认','ai');
});

render();
})();
