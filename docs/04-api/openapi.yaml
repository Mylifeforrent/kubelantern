  /alerts/{id}/ack:
    post:
      tags: [alerts]
      operationId: ack_alert
      summary: 认领告警（Ack）
      description: |
        值班人认领（升级链停止，L2/交互 §4.2 告警处置流）。[CONFLICT-C2] 动作名按契约任务用 ack；
        04-backend-design §4.1 示例为 acknowledge——待评审裁决。
      x-phase: P0
