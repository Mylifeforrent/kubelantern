      required: [id, run_id, cluster_id, rule_code, resource_ref, severity, raw_error, status, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        run_id:
          type: integer
          format: int64
        cluster_id:
          type: integer
          format: int64
        rule_code:
          type: string
          description: 逻辑引用 inspection_rules.code（业务键，领域 §5.2）。
        resource_ref:
          $ref: '#/components/schemas/ResourceRef'
        severity:
          $ref: '#/components/schemas/FindingSeverity'
        raw_error:
          type: object
          additionalProperties: true
          description: 结构化原始错误。
        status:
          $ref: '#/components/schemas/FindingStatus'
        assignee_id:
          type: integer
          format: int64
        ignored_reason:
          type: string
          description: 忽略原因（status=ignored 时必填，D-10）。
        converted_alert_id:
          type: integer
          format: int64
          description: 转告警回链（status=converted_to_alert 时非空，BR-09）。
        resolved_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    FindingSeverity:
      type: string
      description: 发现严重度（01-data-model §3 finding_severity；同 alert_severity [ASSUMPTION]）。
      enum: [info, warning, critical]
    FindingStatus:
      type: string
      description: 发现状态机（01-data-model §3 finding_status，领域 §6 Finding 6 态，值域禁止增删改）。
      enum: [open, acknowledged, in_progress, resolved, ignored, converted_to_alert]
    ResourceRef:
      type: object
      description: 结构化资源引用（01-data-model §2.6 findings.resource_ref；业务键组成）。
      required: [kind, name]
      properties:
        kind:
          type: string
        namespace:
          type: string
        name:
          type: string
    FindingIgnoreRequest:
      type: object
      description: 忽略发现（状态机 open→ignored 填原因，D-10）。
      required: [ignored_reason]
      properties:
        ignored_reason:
          type: string
    # ---------- AI 任务（01-data-model §2.7） ----------
    AITask:
      type: object
      description: |
        AI 任务（01-data-model §2.7 ai_tasks；预算与审批的载体 BR-03/BR-05）。
        详情含 AICallLog 摘要统计；逐条调用日志见 GET /ai/tasks/{id}/call-logs。
      required: [id, type, status, context_refs, budget, calls_used, tokens_used, requires_approval, requested_by, is_partial, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          description: 任务类型（01-data-model §3 ai_task_type）。
          enum: [explain, investigate, workflow_gen]
        status:
          type: string
          description: 任务状态机（01-data-model §3 ai_task_status，领域 §6 AITask 8 态，值域禁止增删改）。
          enum: [created, sanitizing, running, pending_approval, cancelled, completed, failed, budget_exceeded]
        context_refs:
          type: object
          additionalProperties: true
          description: 上下文对象引用（finding/incident/alert 等 id 集合）。
        finding_id:
          type: integer
          format: int64
          description: type=explain 时指向解释对象。
        incident_id:
          type: integer
          format: int64
          description: type=investigate 时指向调查对象。
        budget:
          $ref: '#/components/schemas/AITaskBudget'
        calls_used:
          type: integer
        tokens_used:
          type: integer
          description: 已消耗输出 token。
        requires_approval:
          type: boolean
        requested_by:
          type: integer
          format: int64
        approval_deadline_at:
          type: string
          format: date-time
          description: 审批截止；默认 30min 超时=拒绝 [ASSUMPTION]（P3 上线前校准）。
        approved_by:
          type: integer
          format: int64
        decided_at:
          type: string
          format: date-time
        result:
          type: object
          additionalProperties: true
          description: 产出（RCA 报告/解释引用/Workflow 草稿）。
        is_partial:
          type: boolean
          description: 超预算优雅降级的部分结论标注（BR-03）。
        error:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
    AITaskBudget:
      type: object
      description: 预算上限（BR-03：默认 40 次调用 / 100k 输出 token，管理员可调）。
      required: [max_calls, max_output_tokens]
      properties:
        max_calls:
          type: integer
        max_output_tokens:
          type: integer
    AICallLog:
      type: object
      description: AI 调用日志（01-data-model §2.7 ai_call_logs；BR-10 全量审计，只追加；prompt 只存摘要不存明文）。
      required: [id, task_id, model, prompt_digest, tokens_in, tokens_out, latency_ms, result_code, created_at]
      properties:
        id:
          type: integer
          format: int64
        task_id:
          type: integer
          format: int64
        model:
          type: string
          description: 实际调用的模型。
        tool_used:
          type: string
          description: 工具标识（A2 循环中的工具调用）。
        prompt_digest:
          type: string
          description: prompt 摘要（sha-256），不存明文（BR-01/BR-12）。
        tokens_in:
          type: integer
        tokens_out:
          type: integer
        latency_ms:
          type: integer
        result_code:
          type: string
          description: 调用结果（01-data-model §3 ai_call_result_code [ASSUMPTION]，P1 AI 网关详设验证）。
          enum: [ok, error, timeout]
        error:
          type: string
        created_at:
          type: string
          format: date-time
