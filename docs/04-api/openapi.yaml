# =============================================================================
# huntai-sre API — OpenAPI 3.1 契约草案（阶段一手写临时事实源）
# 治理依据：docs/03-tech-design/05-fe-be-boundary.md §2（两阶段契约流程）
# 枚举/字段唯一事实源：docs/03-tech-design/01-data-model.md §2/§3
# 阶段二切换后本文件退役归档至 docs/04-api/archive/，禁止复活（05-fe-be-boundary §2.2）
# =============================================================================
openapi: 3.1.0
info:
  title: huntai-sre API
  version: 0.1.0
  summary: huntai-sre（基于 Kubernetes 的企业内部 SRE 运维平台）API 契约草案
  license:
    name: Proprietary（企业内部系统，未对外授权）
    identifier: LicenseRef-Proprietary
  description: |
    ## 定位与治理

    本文件是 huntai-sre 平台 API 的**阶段一手写契约草案**（仓库尚无后端代码时期的临时单一事实源），
    治理依据 `docs/03-tech-design/05-fe-be-boundary.md` §2：

    - 阶段一（当前）：本文件为临时契约源；前端据此生成类型与 mock 开发，后端按草案实现路由与 DTO，
      实现偏差回修草案（独立 PR，spec diff 为审查面）。
    - 阶段二（切换后，永久）：事实源切换为 FastAPI 导出的 `docs/04-api/openapi.json`，
      CI 以 `git diff --exit-code` 强制同步（`04-backend-design.md` §4.5）；本草案一次性退役归档。

    ## 契约对齐基线（05-fe-be-boundary §2.2「草案必须对齐的三件事」）

    1. 错误结构：RFC 7807 `application/problem+json`（本文件 `Problem` schema）。
    2. 分页：查询参数 `offset`/`limit`（limit 上限 200、offset 上限 10000），
       响应平铺 `{items, total, offset, limit}`（`PageMeta`）。
    3. 枚举值域：逐条复制 `03-tech-design/01-data-model.md` §3 枚举字典，禁止自创值。

    ## 通用约定

    - JSON 字段命名一律 snake_case（05-fe-be-boundary §2.4）；时间一律 UTC ISO 8601（`date-time`，带 `Z` 后缀）。
    - 认证占位 `bearerAuth`：认证方式（SSO/LDAP/本地）`[TBD-INFRA]`（基础设施负责人 / P0 部署设计）；
      webhook 机器入口与 `/auth/token` 不走 bearer（security 为空）。
    - 每个操作标注 `x-phase`（P0/P1/P2/P3 分期）与 `x-roles`（所需角色，取自领域文档 §3 权限矩阵；
      `(T)` 后缀 = 限本团队，由后端行级过滤实现，前端不做安全边界）。

    ## 与既有文档的冲突登记（[CONFLICT]，待评审裁决，裁决前不引入第三方案）

    - [CONFLICT-C1] webhook 接入路径：本草案 `POST /alerts/webhook/{provider_key}`（按契约任务指定）
      vs `04-backend-design.md` §4.1/§3.2.1 的 `POST /webhooks/{provider_name}`。裁决证据：redocly lint
      报告本草案路径与 `/alerts/{id}/ack` 等存在路由歧义（如 URL `/alerts/webhook/ack` 双匹配），既有方案无此问题。
    - [CONFLICT-C2] 告警/发现「认领」动作命名：本草案 `POST /alerts/{id}/ack`、`POST /findings/{id}/ack`
      （按契约任务指定）vs `04-backend-design.md` §4.1 示例 `POST /alerts/{id}/acknowledge`。
    - [CONFLICT-C3] AI 任务资源路径：本草案 `/ai/tasks`（按契约任务指定）
      vs `04-backend-design.md` §4.1 的 `/ai-tasks`。
    - [CONFLICT-C4] 实时流路径：本草案 `GET /realtime/stream`（按契约任务指定）
      vs `04-backend-design.md` §5.1 的 `GET /stream`。

    ## 开放事项（节选，全集见 docs/04-api/README.md）

    - SSE 通道选型最终确认 `[TBD-FE]`（ADR-0006）；事件类型命名为草案定义（命名权归 04-api，
      05-fe-be-boundary §1 实时推送行）。
    - 状态页可见性默认值、升级链各级超时与渠道组合 `[TBD-BIZ]`（业务负责人 / P2 设计前）。
servers:
  - url: /api/v1
    description: 同源部署相对路径；前端 dev 经 Vite proxy 指向 api 进程或 mock server（05-fe-be-boundary §3.1 S4）。
security:
  - bearerAuth: []
tags:
  - name: auth
    description: 认证与用户、角色（P0，admin）
  - name: clusters
    description: 集群接入与连接健康（P0，admin）
  - name: providers
    description: 告警源提供方（P0，admin）
  - name: alert-ingestion
    description: 告警 webhook 机器入口（P0，Provider 令牌，非用户认证）
  - name: alerts
    description: 告警工作台（P0 列表/详情/认领/关闭；P1 解释；P2 转事件）
  - name: alert-rules
    description: 富化规则（P0）、关联规则（P2）、维护窗口（P2）
  - name: incident-candidates
    description: 候选事件确认队列（P2，BR-04）
  - name: incidents
    description: 事件生命周期、状态页联动、AI 调查、复盘（P2/P3）
  - name: status-page
    description: 状态页条目（P2，BR-06）
  - name: inspections
    description: 巡检规则、策略、执行（P0）
  - name: findings
    description: 巡检发现与处置（P0；P1 AI 解释 BR-09）
  - name: ai-tasks
    description: AI 任务中心：审批、取消、调用审计（P1，BR-02/03/05/10）
  - name: oncall
    description: 排班表与升级策略（P2）
  - name: notifications
    description: 通知记录审计查询（P2，BR-08）
  - name: workflows
    description: Workflow 编排（P3 概要级，BR-05）
  - name: realtime
    description: SSE 实时推送（P0 起，[TBD-FE] 通道最终确认 ADR-0006）
  - name: audit
    description: 审计日志（P0，admin，只读不可删改 BR-10）

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        占位方案。认证方式（SSO/LDAP/本地）`[TBD-INFRA]`（基础设施负责人 / P0 部署设计，
        沿 04-backend-design §8 / 01-data-model §9）；确定后本 securityScheme 与 /auth/token 端点随之修订。
  parameters:
    OffsetParam:
      name: offset
      in: query
      required: false
      description: 分页偏移；上限 10000 防深分页（04-backend-design §4.3 [ASSUMPTION]，P0 压测校准）。
      schema:
        type: integer
        minimum: 0
        maximum: 10000
        default: 0
    LimitParam:
      name: limit
      in: query
      required: false
      description: 每页条数；上限 200（04-backend-design §4.3）。
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IdParam:
      name: id
      in: path
      required: true
      description: 资源主键（bigint 代理键，01-data-model §2.1）。
      schema:
        type: integer
        format: int64
  responses:
    BadRequest:
      description: 参数/过滤字段非法（04-backend-design §4.4）。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: 未认证。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: 权限矩阵拒绝（领域文档 §3）。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: 资源不存在；团队隔离下的越权访问一律 404 防资源探测（04-backend-design §4.4）。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 状态机非法迁移或唯一约束冲突（如 cancelled 缺原因、已 resolved 再认领，04-backend-design §4.4）。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: webhook 限流（04-backend-design §3.2.3：超限请求仍落盘，等价于标记 pending，返回 429）。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: 内部错误（detail 不泄内部信息，04-backend-design §4.4）。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    # ---------- 通用 ----------
    Problem:
      type: object
      description: |
        RFC 7807 错误响应（04-backend-design §4.4）。`type` URL 域名占位，随部署域名定 `[TBD-INFRA]`。
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
          description: 面向开发者的诊断信息，不是 UI 文案（05-fe-be-boundary §6 AP-2）。
        instance:
          type: string
        code:
          type: string
          description: 平台错误码扩展成员（如 ALERT_STATE_CONFLICT）；错误码清单位 [ASSUMPTION]（04-api 定稿时随清单一并固化）。
        trace_id:
          type: string
          description: 请求级追踪 id，与结构化日志关联（04-backend-design §6.1）。
    PageMeta:
      type: object
      description: 分页 envelope 元数据；与 items 平铺在同一响应对象（04-backend-design §4.3：`{items, total, offset, limit}`）。
      required: [total, offset, limit]
      properties:
        total:
          type: integer
          minimum: 0
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 200
    # ---------- 认证与用户（01-data-model §2.2） ----------
    RoleCode:
      type: string
      description: 角色标识（领域文档 §3：admin / sre / oncall_manager / developer / viewer）。
      enum: [admin, sre, oncall_manager, developer, viewer]
    AuthTokenRequest:
      type: object
      description: 登录请求占位。认证方式（SSO/LDAP/本地）`[TBD-INFRA]`（基础设施负责人 / P0 部署设计），请求体形态随认证结论修订。
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    AuthTokenResponse:
      type: object
      description: 令牌响应占位 `[TBD-INFRA]`（同 AuthTokenRequest）。
      required: [access_token, token_type]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [bearer]
        expires_in:
          type: integer
          description: 有效期（秒）。
    User:
      type: object
      description: 用户（01-data-model §2.2 users）。不含密码/凭据字段。
      required: [id, username, email, display_name, is_active, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: string
        team:
          type: string
          description: 所属团队；团队数据源（CMDB 对接 or 自维护）`[TBD-BIZ]`（业务负责人 / P0 设计前）。
        roles:
          type: array
          description: 授予的角色列表（user_roles）[ASSUMPTION]（结构随 P0 权限模块详设固化）。
          items:
            $ref: '#/components/schemas/UserRoleGrant'
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UserRoleGrant:
      type: object
      description: 用户-角色授予（01-data-model §2.2 user_roles）。
      required: [role_code]
      properties:
        role_code:
          $ref: '#/components/schemas/RoleCode'
        team_scope:
          type: string
          description: developer 角色「限本团队」的授权范围（权限矩阵 T 列）；其他角色为 NULL [ASSUMPTION]。
    UserCreate:
      type: object
      description: 创建用户。不含密码字段（认证方式 `[TBD-INFRA]`）。
      required: [username, email, display_name]
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: string
        team:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/UserRoleGrant'
    UserUpdate:
      type: object
      description: 更新用户（部分字段；状态化停用用 is_active=false，D-7）。
      minProperties: 1
      properties:
        display_name:
          type: string
        team:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/UserRoleGrant'
        is_active:
          type: boolean
    Role:
      type: object
      description: 角色（01-data-model §2.2 roles）；permissions 为领域 §3 权限矩阵的 JSON 落库 [ASSUMPTION]（结构见 04-backend-design §4.2 示例）。
      required: [id, code, name, permissions, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        code:
          $ref: '#/components/schemas/RoleCode'
        name:
          type: string
        permissions:
          type: object
          additionalProperties: true
          description: 资源 × 动作权限矩阵（Y/N/T），结构 [ASSUMPTION]（P0 权限模块详设评审）。
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    # ---------- 集群与接入（01-data-model §2.3） ----------
    Cluster:
      type: object
      description: 集群（01-data-model §2.3 clusters）。凭证只暴露 credential_id 引用，secret_ref 不经集群资源透出（D-2）。
      required: [id, name, environment, api_endpoint, status, credential_id, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        environment:
          type: string
          description: 环境标识（dev/staging/prod 等开放值，不做枚举）。
        api_endpoint:
          type: string
          format: uri
        status:
          $ref: '#/components/schemas/ClusterStatus'
        k8s_version:
          type: string
          description: 最近探测到的版本。
        credential_id:
          type: integer
          format: int64
          description: 只读凭证引用（credentials.id；默认 readonly，BR-02）。
        last_checked_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ClusterStatus:
      type: string
      description: 集群连接健康状态（01-data-model §3 cluster_status；值域 [ASSUMPTION]，P0 接入域详设验证）。
      enum: [connected, degraded, disconnected, unknown]
    ClusterCreate:
      type: object
      description: 创建集群。凭证引用需先在密钥管理建立（credentials 资源端点未在本草案覆盖，[TBD-INFRA] P0 工程化时定是否补充，见 04-api/README.md 开放问题）。
      required: [name, environment, api_endpoint, credential_id]
      properties:
        name:
          type: string
        environment:
          type: string
        api_endpoint:
          type: string
          format: uri
        credential_id:
          type: integer
          format: int64
    ClusterUpdate:
      type: object
      description: 更新集群。
      minProperties: 1
      properties:
        name:
          type: string
        environment:
          type: string
        api_endpoint:
          type: string
          format: uri
        credential_id:
          type: integer
          format: int64
    ConnectionTestResult:
      type: object
      description: 连接测试结果；status/k8s_version 回写 clusters [ASSUMPTION]（结构随 P0 接入域详设微调）。
      required: [status, checked_at]
      properties:
        status:
          $ref: '#/components/schemas/ClusterStatus'
        k8s_version:
          type: string
        message:
          type: string
        checked_at:
          type: string
          format: date-time
    # ---------- Provider（01-data-model §2.4 providers） ----------
    Provider:
      type: object
      description: |
        告警源提供方（01-data-model §2.4 providers）。config 为非敏感配置，严禁写入任何密钥值
        （领域文档 §8 凭据安全红线；providers.config 禁止写入密钥值，D-2）。
      required: [id, name, type, category, config, fingerprint_fields, enabled, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        type:
          type: string
          description: 类型标识（如 alertmanager、prometheus、dingtalk-action），开放集合。
        category:
          $ref: '#/components/schemas/ProviderCategory'
        pull_mode:
          $ref: '#/components/schemas/ProviderPullMode'
        config:
          type: object
          additionalProperties: true
          description: 非敏感配置（endpoint、过滤条件等）。
        credential_id:
          type: integer
          format: int64
          description: Provider 凭据引用（可空）。
        fingerprint_fields:
          type: array
          items:
            type: string
          description: 参与指纹计算的字段清单。
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProviderCategory:
      type: string
      description: Provider 三类角色（01-data-model §3 provider_category）。
      enum: [source, query, action]
    ProviderPullMode:
      type: string
      description: 拉取模式（01-data-model §3 provider_pull_mode；仅 category=source 有意义 [ASSUMPTION]）。
      enum: [push, poll]
    ProviderCreate:
      type: object
      required: [name, type, category]
      properties:
        name:
          type: string
        type:
          type: string
        category:
          $ref: '#/components/schemas/ProviderCategory'
        pull_mode:
          $ref: '#/components/schemas/ProviderPullMode'
        config:
          type: object
          additionalProperties: true
        credential_id:
          type: integer
          format: int64
        fingerprint_fields:
          type: array
          items:
            type: string
        enabled:
          type: boolean
          default: true
    ProviderUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
        type:
          type: string
        category:
          $ref: '#/components/schemas/ProviderCategory'
        pull_mode:
          $ref: '#/components/schemas/ProviderPullMode'
        config:
          type: object
          additionalProperties: true
        credential_id:
          type: integer
          format: int64
        fingerprint_fields:
          type: array
          items:
            type: string
        enabled:
          type: boolean
    WebhookIngestResult:
      type: object
      description: webhook 接入应答（04-backend-design §3.2.1 第 5 步：先落盘再入队，落盘即返 202；body {alert_id, merged}）。
      required: [alert_id, merged]
      properties:
        alert_id:
          type: integer
          format: int64
        merged:
          type: boolean
          description: true = 命中活跃 fingerprint 合并计数（不产生新行）；false = 新告警已落库。
    # ---------- 告警（01-data-model §2.4 alerts） ----------
    Alert:
      type: object
      description: |
        告警列表项（01-data-model §2.4 alerts）。列表省略 raw_payload 以减载 [ASSUMPTION]
        （验证方式：P0 告警工作台性能评审）；occurrence_count 为同 fingerprint 合并计数（L1 去重）。
      required: [id, fingerprint, provider_id, severity, status, occurrence_count, first_occurred_at, last_occurred_at, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        fingerprint:
          type: string
          description: 去重主维度（业务键）；活跃周期内唯一（D-1 部分唯一索引）。
        provider_id:
          type: integer
          format: int64
        title:
          type: string
          description: 列表展示标题，从 payload 归一化提取 [ASSUMPTION]（P0 前端信息架构评审）。
        severity:
          $ref: '#/components/schemas/AlertSeverity'
        status:
          $ref: '#/components/schemas/AlertStatus'
        labels:
          type: object
          additionalProperties: true
          description: 归一化标签（原始标签）。
        enrichments:
          type: object
          additionalProperties: true
          description: 富化管道附加字段（team/影响面/oncall 组等），与原始 labels 分离（降噪归因展示依据）。
        occurrence_count:
          type: integer
          description: 同 fingerprint 合并计数。
        first_occurred_at:
          type: string
          format: date-time
        last_occurred_at:
          type: string
          format: date-time
        assignee_id:
          type: integer
          format: int64
        acknowledged_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
        suppressed_by_window_id:
          type: integer
          format: int64
          description: 被哪个维护窗口抑制（BR-07；status=suppressed 时非空）。
        created_at:
          type: string
