    # ---------- Workflow（01-data-model §2.9，P3 概要级） ----------
    Workflow:
      type: object
      description: |
        编排定义（01-data-model §2.9 workflows；一版本一行，UNIQUE(name, version)）。
        source=ai_generated 时 approved_by 必填（BR-05，D-10 库级约束）；人工确认前不得执行。
        P3 概要级：字段级契约随 P3 详设另立（05-fe-be-boundary §4 注）。
      required: [id, name, version, yaml, source, enabled, is_current, created_by, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        version:
          type: integer
        yaml:
          type: string
          description: 编排定义（YAML 文本）。
        source:
          type: string
          description: 来源（01-data-model §3 workflow_source）。
          enum: [manual, ai_generated]
        approved_by:
          type: integer
          format: int64
          description: ai_generated 时必填（BR-05）。
        enabled:
          type: boolean
        is_current:
          type: boolean
          description: 当前生效版本。
        created_by:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WorkflowCreate:
      type: object
      required: [name, yaml]
      properties:
        name:
          type: string
        yaml:
          type: string
        enabled:
          type: boolean
          default: true
    WorkflowVersionCreate:
      type: object
      description: 为已有 Workflow 提交新版本（A3 diff 预览后入库；版本号自增）。
      required: [yaml]
      properties:
        yaml:
          type: string
    WorkflowFromDescriptionRequest:
      type: object
      description: A3 自然语言生成 Workflow（范式 C）。产出为「提议」地位，人工确认（approve）前不得执行（BR-05）。
      required: [description]
      properties:
        description:
          type: string
          description: 自然语言自动化需求描述。
    WorkflowRun:
      type: object
      description: 编排执行（01-data-model §2.9 workflow_runs；P3 概要级）。
      required: [id, workflow_id, workflow_version, yaml_snapshot, trigger_type, status, started_at, created_at]
      properties:
        id:
          type: integer
          format: int64
        workflow_id:
          type: integer
          format: int64
        workflow_version:
          type: integer
        yaml_snapshot:
          type: string
          description: 执行快照（可审计可回放）。
        trigger_type:
          type: string
          description: 触发方式（01-data-model §3 workflow_run_trigger）。
          enum: [alert, manual, schedule]
        triggered_by:
          type: integer
          format: int64
        alert_id:
          type: integer
          format: int64
        incident_id:
          type: integer
          format: int64
        status:
          type: string
          description: 执行状态机（01-data-model §3 workflow_run_status，领域 §6 WorkflowRun 7 态，值域禁止增删改）。
          enum: [triggered, running, waiting_approval, cancelled, succeeded, failed, timeout]
        steps_log:
          type: array
          items:
            type: object
            additionalProperties: true
          description: 步骤执行日志（含 waiting_approval 的审批步骤）。
        error:
          type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    WorkflowRunCreate:
      type: object
      description: 手动触发执行（trigger_type=manual）。
      required: [workflow_id]
      properties:
        workflow_id:
          type: integer
          format: int64
        alert_id:
          type: integer
          format: int64
          description: alert 触发上下文（可选）。
        incident_id:
          type: integer
          format: int64
          description: 事件关联上下文（可选）。
