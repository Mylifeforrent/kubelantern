        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /alerts/{id}/close:
    post:
      tags: [alerts]
      operationId: close_alert
      summary: 关闭告警
      description: 人工关闭（notified→resolved；恢复/人工关闭语义，状态机 §6 Alert）。oncall_manager 无关闭权（权限矩阵）。
      x-phase: P0
      x-roles: [admin, sre]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: 已关闭（resolved_at 已写入）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /alerts/{id}/convert-to-incident:
    post:
      tags: [alerts]
      operationId: convert_alert_to_incident
      summary: 一键转事件
      description: 人工立项（source=manual，P2 事件落地；P0 为入口占位，见 05-fe-be-boundary §4 M0）。请求体可携带事件标题/严重度/团队与关联告警集合。
      x-phase: P2
