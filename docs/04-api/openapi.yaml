  /realtime/stream:
    get:
      tags: [realtime]
      operationId: subscribe_realtime_stream
      summary: 实时事件流（SSE）
      description: |
        SSE 订阅端点（text/event-stream）。载荷最小化：推送只通知变更，详情由前端按 resource_id 拉取
        （04-backend-design §5.2）；心跳为 SSE comment（默认 15s [ASSUMPTION]）。

        **事件类型**（本草案定义，命名权归 04-api，05-fe-be-boundary §1 实时推送行 [ASSUMPTION]）：
        `alert.updated`（告警状态/计数变更）、`incident.timeline.updated`（事件时间线追加）、
        `ai_task.updated`（AI 任务状态推进，含 pending_approval）。

        **断连恢复**：客户端重连携带 Last-Event-ID（Redis Stream ID），服务端回放缺失事件后转实时
