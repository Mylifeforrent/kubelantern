      summary: 告警详情
      description: 侧栏详情：原始 payload + 富化字段（enrichments）+ 降噪归因支撑字段（合并计数/抑制窗口/状态轨迹）。降噪归因展示方式 `[TBD-UX]`（UX / P0 前端设计前）。
      x-phase: P0
