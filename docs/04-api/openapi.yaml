        告警级解释映射（经 converted finding 回链或告警上下文任务）为 [ASSUMPTION]
        （验证方式：P1 AI 域详设评审，确认后回流 01-data-model）。
      required: [id, finding_id, sanitized_input_digest, output, model, tokens, created_at]
