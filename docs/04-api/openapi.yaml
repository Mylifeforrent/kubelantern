            schema:
              $ref: '#/components/schemas/ClusterUpdate'
      responses:
        '200':
          description: 更新成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cluster'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
