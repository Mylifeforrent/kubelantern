  # ---------- 告警 webhook 机器入口 ----------
  /alerts/webhook/{provider_key}:
    post:
      tags: [alert-ingestion]
      operationId: ingest_alert_webhook
      summary: 告警 webhook 接入（机器入口）
      description: |
        监控源（Alertmanager/Prometheus 等）上报入口，L1 管道起点（先落盘再入队，ADR-0003）：
        归一化 → 指纹 upsert 落库（D-1 活跃指纹唯一）→ 入队 → 立即应答 202（body {alert_id, merged}）；
        同指纹活跃告警合并计数（occurrence_count+1），不产生新行。平台故障不丢告警（非功能 §8）。

        鉴权：不走用户 bearer（security 为空）；Provider 令牌/签名认证 `[ASSUMPTION]`
        （沿 HLD §1.3 与 04-backend-design §3.2.1，P0 Provider 框架详设定），并施加独立限流（429 时仍落盘）。
        provider_key 为 Provider 标识（name [ASSUMPTION]，P0 Provider 框架详设定）。

        [CONFLICT-C1] 本路径按契约任务指定为 `POST /alerts/webhook/{provider_key}`；
        `04-backend-design.md` §4.1/§3.2.1 为 `POST /webhooks/{provider_name}`——待评审裁决，裁决前不引入第三方案。
      x-phase: P0
      x-roles: []
      security: []
      parameters:
        - name: provider_key
          in: path
          required: true
          description: Provider 标识（providers.name [ASSUMPTION]）。
          schema: {type: string}
      requestBody:
        required: true
        description: 原始告警 payload（结构随 Provider 类型，归一化由平台完成）；body 以原始上报格式透传。
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: 已接收并落盘（落盘即应答，管道异步处理）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookIngestResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  # ---------- 告警 ----------
  /alerts:
    get:
      tags: [alerts]
      operationId: list_alerts
      summary: 告警列表（工作台）
      description: |
        告警工作台列表：fingerprint 合并计数（occurrence_count）、severity/status/team/fingerprint 过滤
        （交互文档 §4.1）。developer 限本团队（行级过滤 enrichments.team）；oncall_manager 只读；
