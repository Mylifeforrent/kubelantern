# =============================================================================
# 路径（每条操作标注 x-phase 分期与 x-roles 所需角色；(T) = 限本团队行级过滤）
# =============================================================================
paths:
  # ---------- 认证与用户 ----------
  /auth/token:
    post:
      tags: [auth]
      operationId: issue_token
      summary: 登录换取访问令牌（占位）
      description: |
        认证入口占位端点。认证方式（SSO/LDAP/本地）`[TBD-INFRA]`（基础设施负责人 / P0 部署设计，
        决定 M0 session 资源形态、登录页形态与 SSE 认证手段，05-fe-be-boundary §7）；
        结论确定后本端点与 bearerAuth 方案随之修订。不走 bearer 认证。
      x-phase: P0
      x-roles: []
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthTokenRequest'
      responses:
        '200':
          description: 签发成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users:
    get:
      tags: [auth]
      operationId: list_users
      summary: 用户列表
      description: 用户分页列表（管理后台·用户角色页）。矩阵未单列「用户目录查看」，草案收敛为 admin `[ASSUMPTION]`（P0 权限模块详设评审；若展示名解析需全员可读，届时增补只读端点）。
      x-phase: P0
      x-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/OffsetParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: team
          in: query
          required: false
          schema: {type: string}
          description: 按团队过滤。
        - name: is_active
          in: query
          required: false
          schema: {type: boolean}
      responses:
        '200':
          description: 用户分页列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [auth]
      operationId: create_user
      summary: 创建用户
      description: 创建用户并授予角色（user_roles；developer 角色需带 team_scope，支撑 T 列团队隔离）。不含密码字段（认证 `[TBD-INFRA]`）。
      x-phase: P0
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: 创建成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [auth]
      operationId: get_user
      summary: 用户详情
      description: 查询单个用户（含角色授予）。
      x-phase: P0
      x-roles: [admin]
      responses:
        '200':
          description: 用户详情。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [auth]
      operationId: update_user
      summary: 更新用户
      description: 更新展示名/团队/角色授予；停用以 is_active=false（状态化删除，D-7）。
      x-phase: P0
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: 更新成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /roles:
    get:
      tags: [auth]
      operationId: list_roles
      summary: 角色列表
      description: 角色与权限矩阵（领域文档 §3 五角色：admin/sre/oncall_manager/developer/viewer；permissions 结构 [ASSUMPTION]，P0 权限模块详设）。
      x-phase: P0
      x-roles: [admin]
      responses:
        '200':
          description: 角色列表（全集，不分页）。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
