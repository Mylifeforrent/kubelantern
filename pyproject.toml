[project]
name = "huntai"
version = "0.1.0"
description = "huntai-sre 后端：模块化单体 FastAPI + arq worker（api/worker 同镜像多角色）"
readme = "frontend/README.md"
requires-python = ">=3.12"
# 版本只写宽松下限，实际版本以 uv.lock 首锁为准（ADR-0008；具体版本号 [TBD-INFRA]）。
# 已冻结清单见 docs/03-tech-design/04-backend-design.md §1.1；cryptography 为掩码加密必需（待依赖审计登记）。
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "arq>=0.26",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "kubernetes>=30.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "cryptography>=42.0",
    # AI provider（gateway/providers/*.py）运行时依赖，不能只放 dev 组。
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
]

[project.scripts]
huntai-api = "huntai.app.main:run"
huntai-worker = "huntai.workers.settings:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/huntai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: 需要 compose 起的 PostgreSQL/Redis（无则自动 skip）",
]
addopts = "-q"

[tool.coverage.run]
source = ["src/huntai"]
